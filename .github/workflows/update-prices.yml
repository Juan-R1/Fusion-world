name: Update Live Prices

on:
  schedule:
    - cron: '0 5 * * 1'   # Every Monday at 05:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'rotation (3 sets, ~25 reqs, quota-safe) or full (all 9 sets, ~67 reqs, quota-risky)'
        type: choice
        options:
          - rotation
          - full
        default: rotation
      sets:
        description: 'Optional explicit set list (e.g. "FB01,FB02,FB03"). Overrides ISO-week auto-rotation. Ignored when mode=full.'
        required: false
        default: ''

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest prices from JustTCG
        env:
          JUSTTCG_API_KEY: ${{ secrets.JUSTTCG_API_KEY }}
          UPDATE_MODE:     ${{ inputs.mode || 'rotation' }}
          UPDATE_SETS:     ${{ inputs.sets || '' }}
        run: node scripts/update-prices.js

      - name: Commit updated price files
        uses: EndBug/add-and-commit@v9
        with:
          add: 'src/livePrices.json public/priceHistory30d.json public/priceUpdateLog.json'
          message: 'chore: weekly price update'
          default_author: github_actions

      - name: Open failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const stamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z')
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `update-prices.yml failed: ${stamp}`,
              body: [
                `Workflow: ${context.workflow}`,
                `Run: ${runUrl}`,
                `Ref: ${context.ref}`,
                `Commit: ${context.sha}`,
                '',
                'No secrets are included in this issue body. Inspect the workflow run logs for failure details.',
              ].join('\n'),
            })
