name: Deploy to Vercel

# Production deploy path for FusionMetrics.
#
# Triggers:
#   - push to main (e.g. PR merges)
#   - workflow_run completion of "Update Live Prices" / "Update Card Database"
#     on main (auto-redeploy on weekly price/card cron success)
#
# Strategy: official Vercel CLI installed @latest on every run.
#
# This replaces amondnet/vercel-action@v25 which shipped a frozen CLI
# version that Vercel's deploy API began rejecting in 2026-06
# ("requires version 47.2.2 or later"). Pinning to @latest means a future
# CLI-version bump on Vercel's side can't recur as a deploy failure here.
#
# Secrets used (set in repo settings):
#   - VERCEL_TOKEN
#   - VERCEL_ORG_ID
#   - VERCEL_PROJECT_ID
#
# checkout/setup-node bumped 4 -> 6 to clear the Node-20 deprecation
# (forced off Sept 2026; warned starting Jun 2026).

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Update Live Prices", "Update Card Database"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # For workflow_run triggers, only deploy if the upstream job succeeded.
    if: >
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Vercel CLI (always latest)
        run: npm install --global vercel@latest

      - name: Pull Vercel project configuration (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact to production
        id: deploy
        run: |
          DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Production deployment URL: $DEPLOYMENT_URL"

      - name: Summary
        run: |
          echo "::notice title=Deploy::Deployed to ${{ steps.deploy.outputs.url }}"
