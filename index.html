<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Primary SEO -->
    <title>FusionMetrics — Dragon Ball Fusion World Market Analytics</title>
    <meta name="description" content="Live pricing, value scanner, Box EV calculator, and watchlist for Dragon Ball Super Card Game: Fusion World. Track 1,258 cards across FB01–FB09 with real market data." />
    <meta name="keywords" content="Dragon Ball Fusion World, DBFW, DBSFW, TCG, card prices, Box EV, market analytics, FB01, FB02, FB03, FB04, FB05, FB06, FB07, FB08, FB09" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Favicons & PWA -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph (Discord, iMessage, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FusionMetrics" />
    <meta property="og:title" content="FusionMetrics — DBFW Market Analytics" />
    <meta property="og:description" content="Live pricing, value scanner, Box EV, and watchlist for Dragon Ball Fusion World. 1,258 cards across all 9 sets with real market data." />
    <meta property="og:url" content="https://fusion-metrics-jet.vercel.app/" />
    <meta property="og:image" content="https://fusion-metrics-jet.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FusionMetrics dashboard — live DBFW card prices and analytics" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FusionMetrics — DBFW Market Analytics" />
    <meta name="twitter:description" content="Live pricing, value scanner, Box EV, and watchlist for Dragon Ball Fusion World." />
    <meta name="twitter:image" content="https://fusion-metrics-jet.vercel.app/og-image.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

    <!-- Analytics: uncomment and replace DOMAIN with your deployed domain (e.g. fusionmetrics.vercel.app) -->
    <!-- <script defer data-domain="DOMAIN" src="https://plausible.io/js/script.js"></script> -->

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #0a0a0a; color: #f1f5f9; font-family: 'Outfit', system-ui, sans-serif; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #141414; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #444; }
      input[type="range"] { cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="color:#f1f5f9;background:#0a0a0a;font-family:system-ui,sans-serif;padding:32px;text-align:center">
        FusionMetrics requires JavaScript. Please enable it and reload.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
